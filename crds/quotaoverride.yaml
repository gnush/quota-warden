apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quotaoverrides.quota-warden.gnush.github.io
spec:
  group: quota-warden.gnush.github.io
  scope: Cluster
  names:
    kind: QuotaOverride
    plural: quotaoverrides
    singular: quotaoverride
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Namespace
          type: string
          jsonPath: .spec.namespace
        - name: CPU
          type: string
          jsonPath: .spec.resources.cpu
        - name: Memory
          type: string
          jsonPath: .spec.resources.memory
        - name: Valid
          type: string
          jsonPath: '.status.conditions[?(@.type=="Valid")].status'
        - name: Applied
          type: string
          jsonPath: '.status.conditions[?(@.type=="Applied")].reason'
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        # See QuotaBase: the only column that can show keys the CRD does not name.
        - name: All
          type: string
          jsonPath: .spec.resources
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          # cluster-scoped names are unique, so this allows one override per namespace.
          # namespace is a reserved word in CEL; 1.28 accepts only the escaped form.
          x-kubernetes-validations:
            - rule: self.metadata.name == self.spec.__namespace__
              message: metadata.name must equal spec.namespace
          properties:
            spec:
              type: object
              required: [namespace]
              properties:
                namespace:
                  type: string
                  minLength: 1
                # Same as QuotaBase: the merge validates values.
                resources:
                  type: object
                  additionalProperties:
                    x-kubernetes-int-or-string: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
