apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quotawardenconfigs.quota-warden.gnush.github.io
spec:
  group: quota-warden.gnush.github.io
  scope: Cluster
  names:
    kind: QuotaWardenConfig
    plural: quotawardenconfigs
    singular: quotawardenconfig
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: DryRun
          type: boolean
          jsonPath: .spec.dryRun
        - name: Quota
          type: string
          jsonPath: .spec.resourceQuotaName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # No default: unset manages nothing, {} manages everything.
                # Operators and values are not validated here: a malformed
                # selector is stored and surfaces as a condition on this object.
                managedNamespaces:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                          values:
                            type: array
                            items:
                              type: string
                protectedNamespaces:
                  type: array
                  items:
                    type: string
                resourceQuotaName:
                  type: string
                  default: quota-warden
                dryRun:
                  type: boolean
                  default: false
                # quotas without the managed-by label, including one named resourceQuotaName
                foreignResourceQuotas:
                  type: string
                  enum: [report, delete, ignore]
                  default: report
                # deletes only the owned quota; the sources stay, so relabelling restores it
                onUnmanage:
                  type: string
                  enum: [delete, retain]
                  default: delete
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
