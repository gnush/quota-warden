apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quotawardenconfigs.quota-warden.gnush.github.io
spec:
  group: quota-warden.gnush.github.io
  scope: Cluster
  names:
    kind: QuotaWardenConfig
    plural: quotawardenconfigs
    singular: quotawardenconfig
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # No default: unset manages nothing, {} manages everything.
                # Operators and values are not validated here: a malformed
                # selector is stored and surfaces as a condition (SPEC, Stage 3).
                managedNamespaces:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                          values:
                            type: array
                            items:
                              type: string
                protectedNamespaces:
                  type: array
                  items:
                    type: string
                resourceQuotaName:
                  type: string
                  default: quota-warden
                baseName:
                  type: string
                  default: default
                dryRun:
                  type: boolean
                  default: false
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
