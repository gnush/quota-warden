# kopf's own peering.yaml, minus its namespaced KopfPeering: this operator runs
# cluster-wide, and kopf picks ClusterKopfPeering for that. The object is not
# optional -- the operator sets peering.mandatory, and without the object every
# watch stream stays paused.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterkopfpeerings.kopf.dev
spec:
  group: kopf.dev
  scope: Cluster
  names:
    kind: ClusterKopfPeering
    plural: clusterkopfpeerings
    singular: clusterkopfpeering
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          # kopf writes the peers, and their keep-alives, here
          x-kubernetes-preserve-unknown-fields: true
          properties:
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
