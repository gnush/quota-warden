name: ci

on:
  push:
    branches:
      - master
    tags:
      # x.y.z, vx.y.z, ...
      - "*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # what the image runs on
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  e2e:
    needs: python
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # host kind, then the operator in the image it builds; see cluster/Makefile
      - run: make -f cluster/Makefile venv
      - run: make -f cluster/Makefile e2e
      - run: make -f cluster/Makefile e2e-deploy

  image:
    needs: [python, e2e]
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs attestations and cache entries via GitHub OIDC
      packages: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }} # only build on pull requests
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=sha
      cache: true
      cache-mode: max
      labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
