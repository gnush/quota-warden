apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-warden
  namespace: quota-warden
spec:
  # Raisable: a higher replica gets a higher peering priority by lot and takes
  # over; the rest stand by paused. One writes at a time regardless of the count.
  replicas: 1
  # not Recreate: with more than one replica that would stop all of them
  # between the old and new pod, where a rolling update hands over
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: quota-warden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quota-warden
    spec:
      serviceAccountName: quota-warden
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # release tag, bumped with the git tag
          image: ghcr.io/gnush/quota-warden:1.1.0
          args:
            - --liveness=http://0.0.0.0:8080/healthz
          env:
            - name: QUOTA_WARDEN_CONFIG
              value: default
            - name: QUOTA_WARDEN_RESYNC_INTERVAL
              value: 1h
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
