apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Not `- crds`: that directory has no kustomization of its own, because
# `kubectl apply -f crds/` must keep working. Listed file by file instead.
resources:
  - crds/quotabase.yaml
  - crds/quotaoverride.yaml
  - crds/quotaextension.yaml
  - crds/quotawardenconfig.yaml
  - deploy
